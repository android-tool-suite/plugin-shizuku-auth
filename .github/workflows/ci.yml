name: Component CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: component-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Checkout current SDK and ATS CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/app
          ref: main
          path: _sdk-source

      - name: Checkout provider trust root
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/plugin-registry
          path: _registry

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Publish matching SDK
        shell: pwsh
        run: |
          $repository = Join-Path $env:RUNNER_TEMP 'ats-sdk-repository'
          gradle -p .\_sdk-source :plugin-sdk:publishReleasePublicationToPluginSdkRepository "-PpluginSdkRepository=$repository"
          if ($LASTEXITCODE -ne 0) { throw 'SDK publication failed' }
          "ATS_SDK_REPOSITORY=$repository" >> $env:GITHUB_ENV

      - name: Build signed plugin
        shell: pwsh
        env:
          PROVIDER_SIGNING_KEY_PEM: ${{ secrets.PROVIDER_SIGNING_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROVIDER_SIGNING_KEY_PEM)) { throw 'PROVIDER_SIGNING_KEY_PEM is missing' }
          $signingKey = Join-Path $env:RUNNER_TEMP 'provider-signing-key.pem'
          [IO.File]::WriteAllText($signingKey, $env:PROVIDER_SIGNING_KEY_PEM, [Text.Encoding]::ASCII)
          gradle `
            "-PatsCliPath=$((Resolve-Path .\_sdk-source\tools\plugin\ats.py).Path)" `
            "-PatsProviderSigningKey=$signingKey" `
            "-PatsProviderPublicKey=$((Resolve-Path .\_registry\registry-public.pem).Path)" `
            clean collectArtifacts

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shizuku-auth-${{ github.sha }}
          path: artifacts/shizuku-auth.atsplugin
          if-no-files-found: error

      - name: Prepare debug release assets
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          .\.github\scripts\prepare-release.ps1 `
            -ArtifactPath .\artifacts\shizuku-auth.atsplugin `
            -OutputDirectory .\debug-dist `
            -Channel debug `
            -CommitSha '${{ github.sha }}'

      - name: Publish rolling and historical debug releases
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\.github\scripts\publish-debug.ps1 -AssetDirectory .\debug-dist -Title 'Shizuku Authorization Debug'

      - name: Create registry app token
        id: registry-app-token
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          client-id: ${{ vars.REGISTRY_APP_CLIENT_ID }}
          private-key: ${{ secrets.REGISTRY_APP_PRIVATE_KEY }}
          owner: android-tool-suite
          repositories: plugin-registry
          permission-contents: write

      - name: Notify plugin registry
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        env:
          GH_TOKEN: ${{ steps.registry-app-token.outputs.token }}
        run: .\.github\scripts\dispatch-registry.ps1 -Channel debug -Reference debug
