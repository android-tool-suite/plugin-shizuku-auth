name: Component CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: component-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Checkout plugin
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Read SDK and CLI references
        id: build-references
        shell: pwsh
        run: |
          $sdk = Select-String -Path .\gradle.properties -Pattern '^atsPluginSdkVersion=(.+)$'
          $cli = Select-String -Path .\gradle.properties -Pattern '^atsCliRef=([0-9a-f]{40})$'
          if ($null -eq $sdk -or $null -eq $cli) { throw 'SDK version or pinned ATS CLI reference is missing' }
          "sdk-version=$($sdk.Matches[0].Groups[1].Value.Trim())" >> $env:GITHUB_OUTPUT
          "cli-ref=$($cli.Matches[0].Groups[1].Value)" >> $env:GITHUB_OUTPUT

      - name: Checkout matching SDK
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/app
          ref: plugin-sdk-v${{ steps.build-references.outputs.sdk-version }}
          path: _sdk-source

      - name: Checkout pinned ATS CLI
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/app
          ref: ${{ steps.build-references.outputs.cli-ref }}
          path: _ats-source

      - name: Checkout provider trust root
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: android-tool-suite/plugin-registry
          path: _registry

      - name: Set up JDK 17
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@90ddb51e90a5fd9ba75f40cf85156b7b41bf76a3
        with:
          gradle-version: '8.9'

      - name: Publish matching SDK
        shell: pwsh
        run: |
          $repository = Join-Path $env:RUNNER_TEMP 'ats-sdk-repository'
          gradle -p .\_sdk-source :plugin-sdk:publishReleasePublicationToPluginSdkRepository "-PpluginSdkRepository=$repository"
          if ($LASTEXITCODE -ne 0) { throw 'SDK publication failed' }
          "ATS_SDK_REPOSITORY=$repository" >> $env:GITHUB_ENV

      - name: Build signed plugin
        shell: pwsh
        env:
          PROVIDER_SIGNING_KEY_PEM: ${{ secrets.PROVIDER_SIGNING_KEY_PEM }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:PROVIDER_SIGNING_KEY_PEM)) { throw 'PROVIDER_SIGNING_KEY_PEM is missing' }
          $signingKey = Join-Path $env:RUNNER_TEMP 'provider-signing-key.pem'
          [IO.File]::WriteAllText($signingKey, $env:PROVIDER_SIGNING_KEY_PEM, [Text.Encoding]::ASCII)
          gradle `
            "-PatsCliPath=$((Resolve-Path .\_ats-source\tools\plugin\ats.py).Path)" `
            "-PatsProviderSigningKey=$signingKey" `
            "-PatsProviderPublicKey=$((Resolve-Path .\_registry\registry-public.pem).Path)" `
            clean collectArtifacts

      - name: Upload plugin artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: shizuku-auth-${{ github.sha }}
          path: artifacts/shizuku-auth.atsplugin
          if-no-files-found: error
